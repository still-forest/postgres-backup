name: Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run unit tests
        run: uv run pytest --cov=postgres_backup --cov-report=term-missing

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
        env:
          POSTGRES_PASSWORD: integration
          POSTGRES_DB: pgbackup_integration
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      PGBACKUP_TEST_HOST: localhost
      PGBACKUP_TEST_PORT: "5432"
      PGBACKUP_TEST_USER: postgres
      PGBACKUP_TEST_PASS: integration
      PGBACKUP_TEST_DB: pgbackup_integration
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10
        with:
          enable-cache: true

      # The client must match the major version the service asserts on, and
      # Ubuntu's own repositories lag behind it.
      - name: Install the PostgreSQL 18 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
          # /usr/bin/pg_dump on Debian and Ubuntu is postgresql-common's
          # pg_wrapper, which dispatches to a binary chosen from the *local
          # cluster*, not from what is installed. The runner image ships a
          # PostgreSQL 16 cluster, so the wrapper selects 16 even with 18
          # installed -- and selects 18 only when connection arguments point at
          # the 18 service. That split is what produced dumps the verification
          # step could not read. Bypass the wrapper entirely.
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      # A separate step because $GITHUB_PATH only affects later steps. Asserting
      # here means a regression fails with one clear message rather than as a
      # scatter of confusing test failures.
      - name: Verify the client really is major 18
        run: |
          pg_dump --version
          pg_restore --version
          pg_dump    --version | grep -Eq '^pg_dump \(PostgreSQL\) 18\.'
          pg_restore --version | grep -Eq '^pg_restore \(PostgreSQL\) 18\.'
          pg_dumpall --version | grep -Eq '^pg_dumpall \(PostgreSQL\) 18\.'
          psql       --version | grep -Eq '^psql \(PostgreSQL\) 18\.'

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run integration tests
        run: uv run pytest -m integration -v

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # The build asserts that every PostgreSQL binary in the image is major 18,
      # so a successful build is itself a meaningful check.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: false
          load: true
          tags: pgbackup:ci

      - name: Smoke test the image
        run: |
          docker run --rm pgbackup:ci --help
          if docker run --rm pgbackup:ci serve; then
            echo "expected a non-zero exit with no configuration" >&2
            exit 1
          fi
