name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/still-forest/postgres-backup

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tags
        id: tags
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            version="${{ github.ref_name }}"
          else
            version="0.0.0-dev"
          fi
          {
            echo "list<<EOF_TAGS"
            echo "${IMAGE}:${version}"
            echo "${IMAGE}:${{ github.sha }}"
            [ "${{ github.ref_type }}" = "tag" ] && echo "${IMAGE}:latest"
            echo "EOF_TAGS"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.list }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/still-forest/postgres-backup:buildcache
          cache-to: type=registry,ref=ghcr.io/still-forest/postgres-backup:buildcache,mode=max
